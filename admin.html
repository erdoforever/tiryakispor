<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin &amp; CMS Paneli — TiryakiSPOR</title>
  <!-- Arama motorlarından gizle -->
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=2.6">
</head>
<body>

  <!-- ===== GİRİŞ EKRANI (CYBER / DARK INDUSTRIAL & MINIMALIST) ===== -->
  <div class="giris-ekrani" id="girisEkrani">
    <div class="giris-kutu">
      <!-- Üst Teknik Çip Etiketi -->
      <div class="giris-etiket">
        <span class="etiket-isik" aria-hidden="true"></span>
        <span class="etiket-metin">GÜVENLİ ERİŞİM // CMS v2.6</span>
      </div>

      <div class="giris-logo">Tiryaki<span>SPOR</span></div>
      <p class="giris-alt">Yönetim Paneli <span class="ayrac">/</span> Atölye Yetkili Girişi</p>

      <div class="hata-mesaj" id="hataMesaj">❌ Yanlış şifre! Lütfen tekrar deneyin.</div>

      <label for="sifreInput">
        <svg class="label-kilit-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Admin Şifresi
      </label>
      <div class="sifre-wrap">
        <input type="password" id="sifreInput" placeholder="••••••••" maxlength="30" autocomplete="off" />
        <button class="goz-btn" id="gozBtn" type="button" title="Göster/Gizle" aria-label="Şifreyi Göster veya Gizle">
          <svg class="goz-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button class="giris-btn" id="girisBtn" type="button">
        <span>Sisteme Giriş Yap</span>
        <svg class="giris-ok-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      <p class="deneme-uyari" id="denemeUyari"></p>

      <a href="/" class="giris-siteye-don">← Ana Siteye Dön</a>
    </div>
  </div>

  <template id="panelSablonu">
    <div class="panel" id="adminPanel">

      <nav class="panel-navbar">
        <div class="panel-logo">Tiryaki<span>SPOR</span> — Admin &amp; CMS</div>
        <div class="panel-navbar-sag">
          <span class="panel-badge" id="okunmamisSayi">0 Yeni Mesaj</span>
          <button class="yayinla-btn" id="btnCanliyaYayinla" title="Değişiklikleri GitHub ve Cloudflare üzerinden anında yayına alır">🚀 Değişiklikleri Canlıya Al</button>
          <button class="cikis-btn" id="cikisBtn">Çıkış Yap</button>
        </div>
      </nav>

      <div class="panel-icerik">

        <!-- CMS Sekmeleri -->
        <div class="cms-nav">
          <button class="cms-tab-btn aktif" data-tab="tabMesajlar">📬 Gelen Mesajlar</button>
          <button class="cms-tab-btn" data-tab="tabGenel">⚙️ İletişim &amp; Genel Ayarlar</button>
          <button class="cms-tab-btn" data-tab="tabHizmetler">⚽ Hizmet Yönetimi</button>
          <button class="cms-tab-btn" data-tab="tabPaketler">🎁 Paketler</button>
          <button class="cms-tab-btn" data-tab="tabYorumlar">⭐ Yorumlar (Vitrin)</button>
          <button class="cms-tab-btn" data-tab="tabSss">❓ SSS (Sıkça Sorulanlar)</button>
        </div>

        <!-- ================= SEKME 1: MESAJLAR ================= -->
        <div class="tab-icerik aktif" id="tabMesajlar">
          <!-- İstatistikler -->
          <div class="istat-grid">
            <div class="istat-kart">
              <div class="ik-label">📬 Toplam Mesaj</div>
              <div class="ik-deger" id="statToplam">0</div>
            </div>
            <div class="istat-kart">
              <div class="ik-label">🔔 Okunmamış</div>
              <div class="ik-deger turuncu" id="statOkunmamis">0</div>
            </div>
            <div class="istat-kart">
              <div class="ik-label">✅ Okundu</div>
              <div class="ik-deger yesil" id="statYanit">0</div>
            </div>
            <div class="istat-kart">
              <div class="ik-label">📅 Bugün</div>
              <div class="ik-deger" id="statBugun">0</div>
            </div>
          </div>

          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>📨 Gelen Müşteri Mesajları</h2>
              <div style="display:flex;gap:10px;">
                <button class="btn-action yenile-btn" id="yenileBtn">🔄 Yenile</button>
                <button class="btn-action yenile-btn" id="hepsiniOku">✔️ Tümünü Okundu Say</button>
                <button class="btn-action temizle-btn" id="hepsiniSil">🗑️ Tümünü Sil</button>
              </div>
            </div>
            <p class="panel-not">ℹ️ Bu mesajlar tarayıcıda kayıtlı olan müşteri form iletileridir. Müşteriler form gönderdiğinde aynı zamanda doğrudan WhatsApp üzerinden de size iletilir.</p>
            <div id="mesajListesi"></div>
          </div>
        </div>

        <!-- ================= SEKME 2: GENEL & İLETİŞİM AYARLARI ================= -->
        <div class="tab-icerik" id="tabGenel">
          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>⚙️ İletişim, WhatsApp ve Çalışma Saatleri</h2>
              <button class="yayinla-btn" id="btnGenelKaydet">💾 Ayarları Kaydet</button>
            </div>
            <div class="cms-grid">
              <div class="cms-form-grup">
                <label for="inpWaNumara">📱 WhatsApp / İletişim Numarası (Başında 90, boşluksuz)</label>
                <input type="text" id="inpWaNumara" placeholder="905314315560" />
              </div>
              <div class="cms-form-grup">
                <label for="inpFormEndpoint">📧 Formspree Endpoint (İsteğe Bağlı e-posta entegrasyonu)</label>
                <input type="text" id="inpFormEndpoint" placeholder="https://formspree.io/f/..." />
              </div>
            </div>
            <div class="cms-grid">
              <div class="cms-form-grup">
                <label for="inpAdresSorgu">📍 Harita Arama Sorgusu (Örn: Menekşe Pasajı, Kızılay, Ankara)</label>
                <input type="text" id="inpAdresSorgu" placeholder="Menekşe Pasajı, Kızılay, Ankara" />
              </div>
              <div class="cms-form-grup">
                <label for="inpHaritaLink">🗺️ Google Haritalar Doğrudan Bağlantı (İsteğe bağlı)</label>
                <input type="text" id="inpHaritaLink" placeholder="https://maps.google.com/..." />
              </div>
            </div>
            <div class="cms-form-grup">
              <label for="inpAdresMetin">🏢 Sitede Görünen Açık Adres (Adres Kartındaki Yazı)</label>
              <textarea id="inpAdresMetin" rows="2" placeholder="İzmir Cad. Menekşe Sok.&#10;Menekşe Pasajı Kızılay/ANKARA"></textarea>
            </div>
            <div class="cms-grid">
              <div class="cms-form-grup">
                <label for="inpHaftaIci">🕒 Hafta İçi Saatleri (Pzt–Cum)</label>
                <input type="text" id="inpHaftaIci" placeholder="10:00 – 18:00" />
              </div>
              <div class="cms-form-grup">
                <label for="inpCumartesi">🕒 Cumartesi Saatleri (Açıksa saat yazın, kapalıysa Kapalı yazın)</label>
                <input type="text" id="inpCumartesi" placeholder="10:00 – 16:00 veya Kapalı" />
              </div>
            </div>
            <div class="cms-form-grup">
              <label for="inpPazar">🕒 Pazar Günü (Açıksa saat yazın, kapalıysa Kapalı yazın)</label>
              <input type="text" id="inpPazar" placeholder="Kapalı" />
            </div>
            <div class="cms-form-grup">
              <label for="inpTurnstileKey">🛡️ Cloudflare Turnstile Site Key (İsteğe bağlı bot koruması)</label>
              <input type="text" id="inpTurnstileKey" placeholder="0x4AAAAAA... (Cloudflare Dashboard'dan alınır)" />
            </div>
          </div>
        </div>

        <!-- ================= SEKME 3: HİZMETLER ================= -->
        <div class="tab-icerik" id="tabHizmetler">
          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>⚽ Tamir &amp; Bakım Hizmetleri (12 Hizmet)</h2>
              <button class="yayinla-btn" id="btnHizmetKaydet">💾 Hizmetleri Kaydet</button>
            </div>
            <div class="cms-liste" id="hizmetlerListesi"></div>
          </div>
        </div>

        <!-- ================= SEKME 4: PAKETLER ================= -->
        <div class="tab-icerik" id="tabPaketler">
          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>🎁 Popüler Paketler</h2>
              <button class="yayinla-btn" id="btnPaketKaydet">💾 Paketleri Kaydet</button>
            </div>
            <div class="cms-liste" id="paketlerListesi"></div>
          </div>
        </div>

        <!-- ================= SEKME 5: YORUMLAR ================= -->
        <div class="tab-icerik" id="tabYorumlar">
          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>⭐ Müşteri Yorumları &amp; Google Vitrini</h2>
              <div style="display:flex;gap:10px;">
                <button class="btn-action yenile-btn" id="btnYorumEkle">➕ Yeni Yorum Ekle</button>
                <button class="yayinla-btn" id="btnYorumKaydet">💾 Yorumları Kaydet</button>
              </div>
            </div>
            <p class="panel-not">ℹ️ Burada düzenlediğiniz yorumlar sitedeki "04 — Müşteri Deneyimleri" vitrininde canlı olarak gösterilir.</p>
            <div class="cms-liste" id="yorumlarListesi"></div>
          </div>
        </div>

        <!-- ================= SEKME 6: SSS ================= -->
        <div class="tab-icerik" id="tabSss">
          <div class="bolum-kutusu">
            <div class="bolum-ust">
              <h2>❓ Sıkça Sorulan Sorular</h2>
              <div style="display:flex;gap:10px;">
                <button class="btn-action yenile-btn" id="btnSssEkle">➕ Yeni Soru Ekle</button>
                <button class="yayinla-btn" id="btnSssKaydet">💾 Soruları Kaydet</button>
              </div>
            </div>
            <div class="cms-liste" id="sssListesi"></div>
          </div>
        </div>

      </div>
    </div>
  </template>

  <!-- Panel Konteyneri (Şifre doğrulanınca dinamik olarak enjekte edilir) -->
  <div id="panelKonteyner"></div>

  <!-- ===== SİLME ONAYI ===== -->
  <dialog class="onay-kutu" id="onayKutu" aria-labelledby="onayMetin">
    <div>
      <p class="onay-metin" id="onayMetin"></p>
      <div class="onay-butonlar">
        <button type="button" class="mk-btn onay-iptal" value="hayir" autofocus>Vazgeç</button>
        <button type="button" class="mk-btn mk-btn-sil" value="evet">🗑️ Evet, Onayla</button>
      </div>
    </div>
  </dialog>

  <!-- Bildirim Toast -->
  <div class="admin-toast" id="adminToast"></div>

  <script src="js/ortak.js"></script>
  <script src="js/ayarlar.js?v=canli"></script>
  <script src="js/admin.js?v=canli"></script>
</body>
</html>
