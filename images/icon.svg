  <text x="256" y="270" font-family="'Inter', sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">TS</text>
  <text x="256" y="325" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFE8D6" text-anchor="middle" letter-spacing="4">TİRYAKİ</text>
